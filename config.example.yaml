# iSAST optional YAML config (pass with --config PATH).
# .env values always take priority; yaml fills gaps only.
isast:
  workdir: /tmp/isast

ai:
  enabled: true
  timeout: 120
  max_retries: 3
  temperature: 0
  batch_size: 20
  context_lines: 30
  validate: true
  dedup: true
  rewrite: true
  risk_analysis: true

# Gateway connection — usually set in .env instead (LLM_PROVIDER/LLM_KEY/LLM_MODEL).
# Keep the key in .env, never in YAML.
# llm:
#   provider: https://api.openai.com/v1
#   model: gpt-5.6

build:
  sandbox: auto